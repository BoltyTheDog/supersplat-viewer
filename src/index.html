<!doctype html>
<html lang="en">
    <head>
        <title>SuperSplat Viewer</title>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <base href="" />
        <link rel="stylesheet" href="./index.css" />

        <!--
            The viewer fills whatever contains it. In the standalone document that is the page,
            so make the page fill the viewport. This lives here rather than in index.css because
            a host page linking the stylesheet must not have its own body restyled.
        -->
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
            }
        </style>

        <!--
            Single injection seam. `renderViewerHtml` replaces the contents of this block to
            supply asset urls and inline settings, so anything generating a page around the
            viewer goes through that function rather than pattern-matching this document.
            Left as `null` for the standalone case.
        -->
        <script type="application/json" id="sse-bootstrap">
            null
        </script>

        <script type="module">
            const createImage = (url) => {
                const img = new Image();
                img.src = url;
                return img;
            };

            const url = new URL(location.href);

            // Embedder-supplied defaults. URL params take precedence over the asset urls below,
            // so an embed can still be overridden per-instance (e.g. `?skybox=` to preview a
            // different sky). Inline `settings` is the exception: it wins over `?settings=`, so a
            // published experience cannot be repointed at someone else's settings file.
            const bootstrap = JSON.parse(document.getElementById('sse-bootstrap').textContent) ?? {};

            const posterUrl = url.searchParams.get('poster') ?? bootstrap.posterUrl ?? null;
            const skyboxUrl = url.searchParams.get('skybox') ?? bootstrap.skyboxUrl ?? null;
            const collisionUrl =
                url.searchParams.get('collision') ?? url.searchParams.get('voxel') ?? bootstrap.collisionUrl ?? null;
            const settingsUrl = url.searchParams.get('settings') ?? bootstrap.settingsUrl ?? './settings.json';
            const hasExplicitContent = url.searchParams.has('content') || Boolean(bootstrap.contentUrl);
            const contentUrl = url.searchParams.get('content') ?? bootstrap.contentUrl ?? './scene.compressed.ply';

            // Names the bootstrap's contentUrl when the url itself has no usable name (a data:
            // uri, say) — the splat format is chosen by the name's extension. Ignored when a
            // ?content= override replaces the url it describes.
            const contentFilename = url.searchParams.has('content') ? null : (bootstrap.contentFilename ?? null);

            const renderer = url.searchParams.has('webgl') ? 'webgl' : 'webgpu';

            const budgetParam = url.searchParams.get('budget');
            const budget = budgetParam !== null ? Number(budgetParam) : undefined;

            // The engine's octree parser fetches lod-meta.json itself and ignores a prefetched
            // response, so starting one here would download the metadata twice. Every other splat
            // parser consumes it, so they keep the head start. `isPrefetchable` in src/index.ts
            // applies the same rule for embedders that do not pass `contents`.
            const contentName = contentFilename ?? new URL(contentUrl, location.href).pathname.split('/').pop() ?? '';
            const prefetchContent = hasExplicitContent && contentName.toLowerCase() !== 'lod-meta.json';

            // createViewer's options, minus the container and the settings. The poster image and
            // the content fetch start here, before the module bundle has arrived.
            const sseOptions = {
                contentUrl,
                contentFilename,
                posterUrl,
                skyboxUrl,
                collisionUrl,
                poster: posterUrl && createImage(posterUrl),
                contents: prefetchContent ? fetch(contentUrl) : undefined,
                ui: !url.searchParams.has('noui'),
                reticle: url.searchParams.has('reticle'),
                noanim: url.searchParams.has('noanim'),
                nofx: url.searchParams.has('nofx'),
                hpr: url.searchParams.has('hpr')
                    ? ['', '1', 'true', 'enable'].includes(url.searchParams.get('hpr'))
                    : undefined,
                ministats: url.searchParams.has('ministats'),
                colorize: url.searchParams.has('colorize'),
                renderer,
                aa: url.searchParams.has('aa'),
                stochastic: url.searchParams.has('stochastic'),
                splatSource: url.searchParams.get('splatSource') ?? undefined,
                variant: url.searchParams.get('variant') ?? undefined,
                budget,
                heatmap: url.searchParams.has('heatmap'),
                fullload: url.searchParams.has('fullload'),
                progressiveLoad: !url.searchParams.has('noprogresive'),
                autoFrame: !url.searchParams.has('noframe'),
                debug: url.searchParams.has('debug'),
                lang: url.searchParams.get('lang'),
                // the standalone document is the one place the window.* hooks belong
                exposeGlobals: true
            };

            window.sse = {
                options: sseOptions,
                bootstrapContent: Boolean(bootstrap.contentUrl),
                // prettier-ignore
                settings: bootstrap.settings ?? fetch(settingsUrl).then((response) => (response.ok ? response.json() : null)).catch(() => null)
            };
        </script>
    </head>
    <body>
        <!-- Application Script -->
        <script type="module">
            import { createViewer } from './index.js';
            import { initAuth, logoutForm, startGallery, galleryUrl, ensureGalleryStyles } from './gallery.js';

            const start = async () => {
                const authenticated = await initAuth();
                if (!authenticated) return;

                const url = new URL(location.href);
                const isViewing =
                    url.searchParams.has('content') ||
                    url.searchParams.has('splat') ||
                    Boolean(window.sse?.bootstrapContent);

                if (!isViewing) {
                    await startGallery(async (splatUrl) => {
                        const target = galleryUrl();
                        if (splatUrl) target.searchParams.set('content', splatUrl);
                        location.assign(target.href);
                    });
                    return;
                }

                // If loading by splat id (?splat=name) without content parameter, resolve its url first
                if (url.searchParams.has('splat') && !url.searchParams.has('content')) {
                    try {
                        const res = await fetch('/api/splats', { cache: 'no-store' });
                        if (res.ok) {
                            const splats = await res.json();
                            const entry = splats.find((s) => s.id === url.searchParams.get('splat'));
                            if (entry) {
                                window.sse.options.contentUrl = entry.url;
                                window.sse.options.contents = fetch(entry.url);
                                if (entry.settingsUrl) {
                                    window.sse.settings = fetch(entry.settingsUrl)
                                        .then((r) => (r.ok ? r.json() : null))
                                        .catch(() => null);
                                }
                                document.title = `${entry.title} | SuperSplat Viewer`;
                            }
                        }
                    } catch (err) {
                        console.warn('Could not resolve splat entry:', err);
                    }
                }

                const { options, settings } = window.sse;
                createViewer({ container: document.body, settings, ...options });

                ensureGalleryStyles();
                const nav = document.createElement('div');
                nav.className = 'editor-gallery-navigation gallery-actions';
                const back = document.createElement('a');
                back.className = 'gallery-button editor-gallery-back';
                back.href = galleryUrl().href;
                back.textContent = '← Splats';
                back.title = 'Back to splats';
                back.addEventListener('pointerdown', (e) => e.stopPropagation());
                nav.append(back);

                const logout = logoutForm();
                if (logout) nav.append(logout);
                document.body.append(nav);
            };

            start().catch(console.error);
        </script>
    </body>
</html>
